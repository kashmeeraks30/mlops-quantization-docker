name: Automation with Docker
    
on: 
    push : 
        branches : docker_ci

jobs :
    train_job :
        runs-on : ubuntu-latest

        steps :
            - name : Checkout
              uses : actions/checkout@v3
            
            - name : Setup Python
              uses : actions/setup-python@v4
              with :
                python-version : '3.9'

            - name : Installing Dependencies
              run : pip install -r requirements.txt

            - name : Training script
              run : python train.py
            
            - name : Upload model as artifact
              uses : actions/upload-artifact@v4
              with :
                name : Trained_Housing_Model
                path : Models/California_Housing_Model.joblib
    
    build_and_test_container :
        runs-on : ubuntu-latest
        needs : train_job

        steps :
            - name : Checkout
              uses : actions/checkout@v3
            
            - name : Setup Python
              uses : actions/setup-python@v4
              with :
                python-version : '3.9'

            - name : Installing Dependencies
              run : pip install -r requirements.txt

            - name : Downloading trained model artifact
              uses : actions/download-artifact@v4
              with :
                name : Trained_Housing_Model
                path : Models/

            - name : Building Docker Image
              run : | 
                echo "Building Docker Image"
                docker build -t assignment3 .
                echo "Successfully built docker image"
                
            - name : Testing the Docker Container
              run : | 
                echo "Testing Docker Container"
                docker run assignment3 python predict.py
                echo "Container test completed"

            - name : Logging into Docker Hub
              uses : docker/login-action@v3
              with :
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}
            
            - name : Pushing the Image to Docker Hub
              run : | 
                docker tag assignment3:latest ${{ secrets.DOCKER_USERNAME }}/assignment3:latest
                docker push ${{ secrets.DOCKER_USERNAME }}/assignment3:latest
                echo "Successfully pushed the image to Docker Hub"





    
